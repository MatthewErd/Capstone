<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>puppies!</title>
</head>
<body>
<h1>Puppy Adoption Page</h1>
<h2>Please enter your information to adopt a puppy and we'll email you back.</h2>
<p>Please Note: First Name, Last Name, Password, and Email are required</p>

<form>
  <label for="fname">First Name:</label>
  <input type="text" id="fname" name="fname" placeholder="First Name">
  <label for="lname">Last Name:</label>
  <input type="text" id="lname" name="lname" placeholder="Last Name">
  <br><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" placeholder="name@email.com">
  <label for="password">Password:</label>
  <input type="password" id="password" name="password">
  <br><br>

  <p>Are you over the age of 18?</p>
  <label for="over18yes">Yes:</label>
  <input type="radio" id="over18yes" name="over18" value="yes">
  <label for="over18no">No:</label>
  <input type="radio" id="over18no" name="over18" value="no">
  <br><br>

  <p>Do you have a Credit Card or PayPal?</p>
  <select id="payment" name="payment">
    <option value="creditcard">Credit Card</option>
    <option value="paypal">PayPal</option>
  </select>
  <br><br>

  <input type="submit" value="Submit Feedback">
</form>

</body>
</html>
