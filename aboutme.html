<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Which Food Are You?</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container">

    <h1 class="text-center text-danger">Which Food Are You?</h1>
    <p class="text-center">Pick the food that matches your personality.</p>

    <div class="row">

      <div class="col-6 bg-warning border border-danger border-3 p-3">
        <img src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=600&h=400&q=80" class="img-fluid" alt="Pizza">
        <h2>Pizza</h2>
        <p>You are friendly and everyone likes you.</p>
      </div>

      <div class="col-6 bg-info border border-primary border-3 p-3">
       <img src="https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?auto=format&fit=crop&w=600&h=400&q=80" class="img-fluid" alt="Taco">
        <h2>Taco</h2>
        <p>You are fun and a little messy.</p>
      </div>

    </div>

    <div class="row">

      <div class="col-6 bg-success-subtle border border-success border-3 p-3">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&h=400&q=80" class="img-fluid" alt="Burger">
        <h2>Burger</h2>
        <p>You are classic and dependable.</p>
      </div>

      <div class="col-6 bg-danger-subtle border border-danger border-3 p-3">
        <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=600&h=400&q=80" class="img-fluid" alt="French fries">
        <h2>Fries</h2>
        <p>You are popular and always extra.</p>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
