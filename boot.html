<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost Dragon</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-warning-subtle">

  <div class="container text-center">

    <h1 class="display-1 text-danger">LOST DRAGON!</h1>

    <p>My dragon named Pickle ran away.</p>
    <p>He is small, green, and likes to eat grapes.</p>
    <p class="border border-danger p-3">
      Please do not feed him spicy food!
    </p>

    <div id="carouselExample" class="carousel slide w-50 mx-auto">

      <div class="carousel-inner">

        <div class="carousel-item active">
          <img src="dragon1.jpg" class="d-block w-100" alt="Dragon picture 1">
        </div>

        <div class="carousel-item">
          <img src="dragon2.jpg" class="d-block w-100" alt="Dragon picture 2">
        </div>

        <div class="carousel-item">
          <img src="dragon3.jpg" class="d-block w-100" alt="Dragon picture 3">
        </div>

      </div>

      <button class="carousel-control-prev" type="button"
        data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button"
        data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>

    <br>

    <a href="https://www.google.com" class="btn btn-success btn-lg">
      Help Find Pickle
    </a>

    <button class="btn btn-secondary btn-lg disabled">
      Reward Coming Soon
    </button>

    <br><br>

    <form>
      <label>Where did you see Pickle?</label>
      <input type="text" class="form-control">
      <button class="btn btn-primary mt-2">Send</button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
